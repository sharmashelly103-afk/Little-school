<title>Vamika's Little School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: a preschool "school bag" — home has three shelves (Likho / Seekho / Khelo) of chunky cards; each activity opens on one big stage that talks by itself. Single bright theme on purpose (a toy). */
:root{
  --bg:#EAF6FF; --ink:#22264A; --card:#FFFFFF; --soft:#CFE3F3;
  --sun:#FFC83D; --berry:#FF5C8A; --leaf:#2FBF7F; --sky:#3E9BFF; --grape:#8E6CFF; --tang:#FF7A45; --teal:#20B2B8;
  --paper:#FFFDF6; --guide:#E6E0F5; --dash:#B9AEDB;
  --display:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
button{font-family:var(--display);color:inherit}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
/* home */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--berry);color:#fff;font-weight:800;font-size:1.25rem;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);box-shadow:0 4px 0 rgba(34,38,74,.2)}
h1{margin:0;font-size:clamp(1.4rem,5.6vw,2.1rem);font-weight:800;line-height:1}
h1 span{color:var(--berry)}
.tag{font-size:.9rem;font-weight:600;opacity:.6;margin:0}
.pill{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:4px;box-shadow:0 3px 0 var(--soft)}
.pill button{font-weight:700;font-size:.95rem;border:0;border-radius:999px;padding:6px 12px;background:transparent;cursor:pointer}
.pill button[aria-pressed="true"]{background:var(--ink);color:#fff}
.shelf{background:var(--card);border-radius:28px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 5px 0 var(--soft)}
h2{margin:0;font-size:1.35rem;font-weight:800;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-size:.85rem;font-weight:600;opacity:.6}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.card{border:0;border-radius:22px;padding:10px 6px 8px;cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(34,38,74,.22);display:flex;flex-direction:column;align-items:center;gap:0;transition:transform .1s}
.card:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(34,38,74,.22)}
.card i{font-style:normal;font-size:2.7rem;line-height:1.15}
.card b{font-size:1.15rem;line-height:1.05}
.card small{font-size:.8rem;font-weight:600;opacity:.92}
.note{background:#FFF4D6;border-radius:18px;padding:10px 14px;font-weight:600;margin:0}
/* play */
.bar{display:flex;align-items:center;gap:10px}
.bar h1{flex:1;text-align:center;font-size:clamp(1.25rem,5vw,1.8rem)}
.round{width:54px;height:54px;flex:none;border:0;border-radius:50%;background:var(--card);box-shadow:0 4px 0 var(--soft);font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stage{background:var(--card);border-radius:30px;min-height:min(70vh,600px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;position:relative;overflow:hidden;box-shadow:0 8px 0 var(--soft)}
.face{display:flex;flex-direction:column;align-items:center;gap:4px}
.big{font-size:clamp(5.5rem,28vw,9.5rem);line-height:1;font-weight:800}
.big small{font-size:.55em}
.pic{font-size:clamp(5.5rem,28vw,9rem);line-height:1.1}
.blob{width:min(180px,46vw);aspect-ratio:1;max-width:100%;border-radius:50%;box-shadow:0 10px 0 rgba(0,0,0,.1),inset 0 0 0 4px rgba(0,0,0,.06)}
.shape{width:min(200px,50vw);aspect-ratio:1;max-width:100%}
.shape svg{width:100%;height:100%}
.spell{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.spell span{min-width:42px;height:52px;padding-inline:6px;border-radius:14px;background:var(--bg);font-size:1.9rem;font-weight:800;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.spell span.on{background:var(--sun);transform:scale(1.22) translateY(-4px)}
.spell.all span{background:var(--leaf);color:#fff}
.cap{font-size:clamp(1.15rem,4.8vw,1.55rem);font-weight:700;opacity:.8;min-height:1.5em;max-width:30ch;text-wrap:balance}
.objs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:520px}
.objs span{font-size:clamp(2.2rem,10vw,3.2rem);opacity:.18;transition:opacity .2s,transform .2s;position:relative}
.objs.shown span{opacity:1}
.objs span.on{opacity:1;transform:scale(1.25)}
.objs span b{position:absolute;top:-8px;right:-6px;background:var(--grape);color:#fff;font-size:.9rem;border-radius:999px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.q{font-size:clamp(1.6rem,6.6vw,2.5rem);font-weight:800;line-height:1.1;text-wrap:balance}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:560px}
.choices button{aspect-ratio:1;max-width:100%;border:0;border-radius:26px;background:var(--bg);font-size:clamp(3rem,15vw,5rem);font-weight:800;cursor:pointer;box-shadow:0 6px 0 var(--soft);display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.choices button svg{width:80%;height:80%}
.choices .dot{display:block;width:72%;aspect-ratio:1;border-radius:50%}
.choices button.right{background:#D9F7E8;box-shadow:0 6px 0 var(--leaf)}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.bounce{animation:bnc .6s infinite}
@keyframes bnc{50%{transform:translateY(-14px) scale(1.06)}}
.wiggle{animation:wig .6s}
@keyframes wig{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
.burst{position:absolute;pointer-events:none;font-size:1.8rem;animation:fly 1s ease-out forwards;z-index:9}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(220deg);opacity:0}}
.score{position:absolute;top:12px;left:16px;font-weight:800;font-size:1.3rem;z-index:4}
/* tracing */
.tracewrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
#cv{width:min(100%,58vh);aspect-ratio:1;max-width:100%;background:var(--paper);border-radius:24px;touch-action:none;box-shadow:inset 0 0 0 3px var(--soft)}
.tctl{display:flex;gap:14px;justify-content:center}
.tctl button{width:64px;height:64px;border:0;border-radius:50%;background:var(--bg);font-size:1.7rem;cursor:pointer;box-shadow:0 4px 0 var(--soft)}
.tlabel{font-size:clamp(1.3rem,5vw,1.8rem);font-weight:800;min-height:1.3em}
.overlay{position:absolute;inset:0;background:rgba(255,255,255,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:6}
.overlay .pic{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.strip{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:4px 2px 8px;scrollbar-width:none}
.strip button{flex:none;min-width:44px;height:44px;border:0;border-radius:12px;background:var(--bg);font-weight:800;font-size:1.25rem;cursor:pointer;padding-inline:8px}
.strip button[aria-current="true"]{background:var(--ink);color:#fff}
.strip button.done{box-shadow:inset 0 -4px 0 var(--leaf)}
/* bubbles */
.field{position:absolute;inset:0}
.target{position:absolute;top:10px;left:0;right:0;z-index:4;font-weight:800;font-size:clamp(1.3rem,5.5vw,1.8rem);display:flex;justify-content:center;align-items:center;gap:8px;pointer-events:none}
.target .dot{width:34px;height:34px;border-radius:50%;display:inline-block}
.bubble{position:absolute;bottom:-120px;width:100px;height:100px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:2.8rem;font-weight:800;color:#fff;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.85) 0 11%,transparent 12%),var(--c);opacity:.95;animation:rise var(--t) linear forwards;box-shadow:inset -6px -8px 0 rgba(0,0,0,.08)}
@keyframes rise{to{transform:translate(var(--sway),var(--h))}}
.bubble.gone{animation:out .25s forwards}
@keyframes out{to{transform:scale(1.7);opacity:0}}
/* feed */
.eater{width:min(220px,56vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:clamp(5rem,26vw,8rem);box-shadow:inset 0 0 0 6px var(--soft);transition:box-shadow .2s}
.eater.near{box-shadow:inset 0 0 0 8px var(--leaf)}
.foods{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.food{width:86px;height:86px;border:0;border-radius:24px;background:var(--paper);font-size:3.4rem;cursor:grab;box-shadow:0 5px 0 var(--soft);touch-action:none;position:relative;z-index:5}
.food.drag{cursor:grabbing;z-index:8;box-shadow:0 14px 24px rgba(34,38,74,.25)}
.food.back{transition:transform .3s}
.food.eaten{transition:transform .35s,opacity .35s;opacity:0}
/* tap tap */
.tapzone{position:absolute;inset:0;touch-action:none;cursor:pointer}
.tapitem{position:absolute;font-size:clamp(4rem,20vw,6.5rem);pointer-events:none;transform:translate(-50%,-50%);animation:tapin 2.2s ease-out forwards;display:flex;flex-direction:column;align-items:center}
.tapitem b{font-size:1.4rem;background:var(--ink);color:#fff;border-radius:999px;padding:0 12px;line-height:1.6}
@keyframes tapin{0%{transform:translate(-50%,-50%) scale(.2)}15%{transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.taphint{font-size:clamp(1.6rem,7vw,2.4rem);font-weight:800;opacity:.35;pointer-events:none}
/* music */
.xylo{display:flex;align-items:flex-end;justify-content:center;gap:6px;width:100%;max-width:560px;height:240px}
.xylo button{flex:1;border:0;border-radius:14px;cursor:pointer;color:#fff;font-weight:800;font-size:1.1rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;box-shadow:0 5px 0 rgba(34,38,74,.2);transition:transform .08s}
.xylo button.hit{transform:translateY(6px);filter:brightness(1.2)}
.songs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.songs button{font-weight:700;font-size:1.05rem;border:0;border-radius:999px;padding:10px 18px;background:var(--ink);color:#fff;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div class="wrap" id="home">
  <div class="top">
    <div class="brand"><div class="logo">abc</div><div><h1>Vamika's <span>Little School</span></h1><p class="tag">Likho · Seekho · Khelo — har cheez bol ke sikhata hai</p></div></div>
    <div class="pill" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">English</button>
      <button id="lang-hi" aria-pressed="false">English + हिंदी</button>
    </div>
  </div>
  <p class="note" id="note" hidden></p>
  <section class="shelf"><h2>Likho <small>tracing — ungli se likhna seekho</small></h2><div class="cards" id="writeCards"></div></section>
  <section class="shelf"><h2>Seekho <small>app khud sikhayega, phir poochega</small></h2><div class="cards" id="learnCards"></div></section>
  <section class="shelf"><h2>Khelo <small>chhote games</small></h2><div class="cards" id="gameCards"></div></section>
</div>

<div class="wrap" id="play" hidden>
  <div class="bar">
    <button class="round" id="back" aria-label="Home">🏠</button>
    <h1 id="ptitle"></h1>
    <button class="round" id="pause" aria-label="Pause">⏸</button>
  </div>
  <section class="stage" id="stage" aria-live="polite"></section>
</div>

<script>

let ac=null, master=null;
function audio(){ try{ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.5; master.connect(ac.destination);} if(ac.state==="suspended") ac.resume(); }catch(e){} return ac; }
function tone(f,dur=.3,type="sine",vol=.4,when=0){
  const a=audio(); if(!a) return; const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
}

const synth=window.speechSynthesis||null;
const voices=()=>{ try{ return synth?synth.getVoices():[] }catch(e){ return [] } };
function voiceFor(l){ const vs=voices(), w=l==="hi"?"hi":"en"; return vs.find(v=>v.lang.toLowerCase().replace("_","-")===w+"-in")||vs.find(v=>v.lang.toLowerCase().startsWith(w)); }
const hasHi=()=>voices().some(v=>v.lang.toLowerCase().startsWith("hi"));
const H=()=>lang==="hi"&&hasHi();
const L_=()=>H()?"hi":"en";
if(synth) synth.onvoiceschanged=()=>showNote();
function speakOne(text,l,cb){
  let done=false, ft=null; const fin=()=>{ if(done) return; done=true; clearTimeout(ft); cb(); };
  const est=700+text.length*120;
  if(!synth){ ft=setTimeout(fin,est); return; }
  ft=setTimeout(fin,est*2.5+1500);
  const u=new SpeechSynthesisUtterance(text), v=voiceFor(l);
  if(v) u.voice=v; u.lang=l==="hi"?"hi-IN":"en-IN"; u.rate=.78; u.pitch=1.2; u.volume=1;
  u.onend=fin; u.onerror=fin;
  try{ synth.resume(); synth.speak(u); }catch(e){ fin(); }
}
function play(segs,done){
  const tok=run; let i=0; segs=segs.filter(Boolean);
  const step=()=>{ if(tok!==run||paused) return;
    if(i>=segs.length){ done&&done(); return; }
    const s=segs[i++]; s.on&&s.on();
    if(!s.t){ later(step,s.gap||0); return; }
    speakOne(s.t,s.l||"en",()=>{ if(tok===run) later(step,s.gap??220); });
  };
  step();
}
function hush(){ run++; try{ synth&&synth.cancel() }catch(e){} }
function stopAll(){ hush(); timers.forEach(t=>{clearTimeout(t);clearInterval(t)}); timers=[]; TR.on=false; }

const TR={on:false};
function resample(pts,step=1.5){ const out=[pts[0]]; for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i], d=Math.hypot(x1-x0,y1-y0), n=Math.max(1,Math.ceil(d/step)); for(let k=1;k<=n;k++) out.push([x0+(x1-x0)*k/n,y0+(y1-y0)*k/n]); } return out; }

function traceList(kind){
  if(kind==="lines") return LINES.map(o=>({kind:"line",label:H()?`${o.n} · ${o.hi}`:o.n,chip:o.a,g:o.g,a:o.a,b:o.b,fin:o.fin,
    intro:[{t:H()?o.sayHi:o.say,l:L_()}], outro:()=>[{t:o.done}], show:o.fin||o.b}));
  if(kind==="abc") return ABC.map(([L,w,e,h])=>({kind:"glyph",label:L,chip:L,g:GLYPH[L],
    intro:[{t:`Let's write ${LN[L]}.`},H()&&{t:`${L} लिखो`,l:"hi"},{t:"Start at the green dot."}],
    outro:()=>[{t:`Wow! ${LN[L]}!`,gap:300},{t:`${LN[L]} for ${w}!`},H()&&{t:`${L} से ${h}`,l:"hi"}], show:e, sub:`${L} for ${w}`}));
  if(kind==="num") return NUM_EN.map((w,i)=>{ const n=i+1, th=THINGS[i]; return {kind:"glyph",label:String(n),chip:String(n),g:GLYPH[String(n)],
    intro:[{t:`Let's write ${w}.`},H()&&{t:`${NUM_HI[i]} लिखो`,l:"hi"},{t:"Start at the green dot."}],
    outro:()=>[{t:`${w}!`,gap:300},{t:"Count with me!"},...Array.from({length:n},(_,k)=>({t:H()?NUM_HI[k]:NUM_EN[k],l:L_(),on:()=>{ const o=$("ovobjs"); o&&o.children[k].classList.add("on"); },gap:150})),{t:`${w} ${th[1]}!`}],
    count:n, thing:th[0], sub:`${n} = ${w}`}; });
  return DOTS.map(o=>({kind:"dots",label:H()?`${o.n} · ${o.hi}`:o.n,chip:o.pts.length,pts:o.pts,e:o.e,
    intro:[{t:H()?"बिंदु जोड़ो! एक से शुरू करो।":"Join the dots! Start at number one."}],
    outro:()=>[{t:H()?`${o.hi}! शाबाश!`:`It's a ${o.n}! Well done!`,l:L_()}], show:o.e}));
}
function openTrace(kind,title){
  enter(title); TR.kind=kind; TR.list=traceList(kind); TR.idx=0; TR.done=new Set();
  stage.innerHTML=`<div class="tracewrap"><div class="tlabel" id="tlabel"></div><canvas id="cv"></canvas><div class="tctl"><button id="tprev" aria-label="Previous">◀</button><button id="tredo" aria-label="Again">↺</button><button id="tnext" aria-label="Next">▶</button></div><div class="strip" id="strip"></div></div><div class="overlay" id="ov" hidden></div>`;
  $("strip").innerHTML=TR.list.map((it,i)=>`<button data-i="${i}" aria-label="${it.label}">${it.chip}</button>`).join("");
  $("strip").onclick=e=>{ const b=e.target.closest("button"); if(b){ TR.idx=+b.dataset.i; loadTrace(); } };
  $("tprev").onclick=()=>{ TR.idx=(TR.idx-1+TR.list.length)%TR.list.length; loadTrace(); };
  $("tnext").onclick=()=>{ TR.idx=(TR.idx+1)%TR.list.length; loadTrace(); };
  $("tredo").onclick=()=>loadTrace();
  const cv=$("cv");
  cv.addEventListener("pointerdown",e=>{ if(!TR.on||TR.finished) return; cv.setPointerCapture(e.pointerId); TR.down=true; TR.last=null; TR.idle=performance.now(); onPt(e); });
  cv.addEventListener("pointermove",e=>{ if(!TR.down) return; (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(onPt); });
  const up=()=>{ TR.down=false; TR.last=null; TR.idle=performance.now(); };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  cur={resume:()=>loadTrace()};
  loadTrace();
}
function loadTrace(){
  stopAll(); $("ov").hidden=true;
  const it=TR.list[TR.idx]; TR.it=it; TR.on=true; TR.finished=false; TR.trail=[]; TR.si=0; TR.k=0; TR.idle=performance.now(); TR.down=false;
  TR.ink=PAL[TR.idx%PAL.length];
  if(it.kind==="dots"){ TR.dn=0; } else { TR.strokes=it.g.map(s=>resample(s)); }
  $("tlabel").textContent=it.kind==="glyph"?(it.sub||it.label):it.label;
  [...$("strip").children].forEach((b,i)=>{ b.setAttribute("aria-current",i===TR.idx); b.classList.toggle("done",TR.done.has(i)); });
  $("strip").children[TR.idx]?.scrollIntoView({block:"nearest",inline:"center"});
  sizeCanvas(); cur.resume=()=>loadTrace();
  later(()=>play(it.intro),250);
  const lt=TR.lt=(TR.lt||0)+1; const loop=()=>{ if(lt!==TR.lt||!TR.on) return; draw(); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
}
function sizeCanvas(){ const cv=$("cv"); const r=cv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1); TR.S=r.width; cv.width=r.width*dpr; cv.height=r.width*dpr; TR.ctx=cv.getContext("2d"); TR.ctx.setTransform(dpr,0,0,dpr,0,0); }
window.addEventListener("resize",()=>{ if(TR.on) sizeCanvas(); });
function toU(e){ const r=$("cv").getBoundingClientRect(); return [(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]; }
function onPt(e){
  const p=toU(e); TR.idle=performance.now();
  /* fill gaps between fast finger events so no part of the path is skipped */
  const pts=[]; if(TR.last){ const d=Math.hypot(p[0]-TR.last[0],p[1]-TR.last[1]), n=Math.ceil(d/2); for(let i=1;i<=n;i++) pts.push([TR.last[0]+(p[0]-TR.last[0])*i/n,TR.last[1]+(p[1]-TR.last[1])*i/n]); } else pts.push(p);
  TR.last=p; TR.trail.push(p); if(TR.trail.length>600) TR.trail.shift();
  pts.forEach(q=>TR.it.kind==="dots"?dotStep(q):traceStep(q));
}
const TOL=13;
function traceStep(q){
  if(TR.finished) return; const P=TR.strokes[TR.si]; if(!P) return;
  if(TR.k===0){ if(Math.hypot(q[0]-P[0][0],q[1]-P[0][1])<TOL*1.3) TR.k=1; else return; }
  let best=TR.k; for(let j=TR.k;j<Math.min(P.length,TR.k+12);j++){ if(Math.hypot(q[0]-P[j][0],q[1]-P[j][1])<TOL) best=j; }
  TR.k=best;
  if(TR.k>=P.length-3){ TR.k=P.length; TR.si++; if(TR.si>=TR.strokes.length) finishTrace(); else { ding(TR.si*2); TR.k=0; TR.last=null; } }
}
function dotStep(q){
  if(TR.finished) return; const pts=TR.it.pts; const nx=pts[TR.dn]; if(!nx) return;
  if(Math.hypot(q[0]-nx[0],q[1]-nx[1])<10){ TR.dn++; hush(); play([{t:H()?NUM_HI[TR.dn-1]:NUM_EN[TR.dn-1],l:L_(),gap:0}]); if(TR.dn>=pts.length) later(finishTrace,700); }
}
function finishTrace(){
  if(TR.finished) return; TR.finished=true; TR.done.add(TR.idx); $("strip").children[TR.idx]?.classList.add("done");
  const it=TR.it; hush(); cheer(); burst();
  later(()=>{
    const ov=$("ov");
    ov.innerHTML=it.count?`<div class="big" style="color:${TR.ink}">${it.label}</div><div class="objs" id="ovobjs">${Array.from({length:it.count},()=>`<span>${it.thing}</span>`).join("")}</div><div class="cap">${it.sub}</div>`
      :`<div class="pic">${it.show}</div>${it.kind==="glyph"?`<div class="big" style="color:${TR.ink};font-size:4rem">${it.label}</div>`:""}<div class="cap">${it.sub||it.label}</div>`;
    ov.hidden=false;
    play(it.outro(),()=>later(()=>{ TR.idx=(TR.idx+1)%TR.list.length; loadTrace(); },1800));
  },900);
}
function draw(){
  const c=TR.ctx, S=TR.S; if(!c) return; const u=v=>v*S/100, it=TR.it, now=performance.now();
  c.clearRect(0,0,S,S);
  /* light baseline guides like a school notebook */
  if(it.kind==="glyph"){ c.strokeStyle="#E5EEF8"; c.lineWidth=2; [10,50,90].forEach(y=>{ c.beginPath(); c.moveTo(u(4),u(y)); c.lineTo(u(96),u(y)); c.stroke(); }); }
  c.lineCap="round"; c.lineJoin="round";
  const path=(P,upto)=>{ c.beginPath(); c.moveTo(u(P[0][0]),u(P[0][1])); for(let i=1;i<Math.min(P.length,upto);i++) c.lineTo(u(P[i][0]),u(P[i][1])); c.stroke(); };
  if(it.kind==="dots"){
    const pts=it.pts;
    if(TR.finished){ c.fillStyle=TR.ink+"55"; c.beginPath(); pts.forEach(([x,y],i)=>i?c.lineTo(u(x),u(y)):c.moveTo(u(x),u(y))); c.closePath(); c.fill(); }
    c.strokeStyle=TR.ink; c.lineWidth=S*.03;
    if(TR.dn>1||TR.finished){ c.beginPath(); pts.slice(0,TR.finished?pts.length:TR.dn).forEach(([x,y],i)=>i?c.lineTo(u(x),u(y)):c.moveTo(u(x),u(y))); if(TR.finished) c.closePath(); c.stroke(); }
    if(TR.dn>0&&!TR.finished&&TR.down&&TR.last){ c.globalAlpha=.35; c.beginPath(); c.moveTo(u(pts[TR.dn-1][0]),u(pts[TR.dn-1][1])); c.lineTo(u(TR.last[0]),u(TR.last[1])); c.stroke(); c.globalAlpha=1; }
    pts.forEach(([x,y],i)=>{
      const isNext=i===TR.dn&&!TR.finished, r=S*(isNext?.05+.008*Math.sin(now/180):.042);
      c.fillStyle=i<TR.dn||TR.finished?TR.ink:isNext?"#2FBF7F":"#C9D4E4"; c.beginPath(); c.arc(u(x),u(y),r,0,7); c.fill();
      c.fillStyle="#fff"; c.font=`800 ${S*.045}px "Baloo 2",sans-serif`; c.textAlign="center"; c.textBaseline="middle"; c.fillText(i+1,u(x),u(y)+S*.004);
    });
    if(TR.finished){ c.font=`${S*.22}px serif`; c.fillText(it.e,S/2,S/2); }
    return;
  }
  /* guide road */
  c.strokeStyle="#E6E0F5"; c.lineWidth=S*.12; TR.strokes.forEach(P=>path(P,P.length));
  c.strokeStyle="#B9AEDB"; c.lineWidth=S*.012; c.setLineDash([S*.025,S*.025]); TR.strokes.forEach(P=>path(P,P.length)); c.setLineDash([]);
  /* child's crayon marks */
  if(TR.trail.length>1){ c.strokeStyle=TR.ink; c.globalAlpha=.22; c.lineWidth=S*.03; c.beginPath(); TR.trail.forEach(([x,y],i)=>{ if(i&&Math.hypot(x-TR.trail[i-1][0],y-TR.trail[i-1][1])>20) c.moveTo(u(x),u(y)); else i?c.lineTo(u(x),u(y)):c.moveTo(u(x),u(y)); }); c.stroke(); c.globalAlpha=1; }
  /* painted progress */
  c.strokeStyle=TR.ink; c.lineWidth=S*.085;
  TR.strokes.forEach((P,i)=>{ if(i<TR.si) path(P,P.length); else if(i===TR.si&&TR.k>1) path(P,TR.k+1); });
  /* end emoji and start dot */
  c.textAlign="center"; c.textBaseline="middle";
  if(it.b&&!TR.finished){ const P=TR.strokes[TR.strokes.length-1], e=P[P.length-1]; c.font=`${S*.11}px serif`; c.fillText(it.b,u(e[0]),u(e[1])); }
  if(!TR.finished){
    const P=TR.strokes[TR.si], head=P[Math.min(TR.k,P.length-1)];
    if(TR.k===0){ const r=S*(.05+.01*Math.sin(now/160)); c.fillStyle="#2FBF7F"; c.beginPath(); c.arc(u(P[0][0]),u(P[0][1]),r,0,7); c.fill();
      if(TR.strokes.length>1&&it.kind==="glyph"){ c.fillStyle="#fff"; c.font=`800 ${S*.05}px "Baloo 2",sans-serif`; c.fillText(TR.si+1,u(P[0][0]),u(P[0][1])+S*.004); } }
    if(it.a){ c.font=`${S*.11}px serif`; c.fillText(it.a,u(head[0]),u(head[1])); }
    else if(TR.k>0){ c.fillStyle="#FFC83D"; c.beginPath(); c.arc(u(head[0]),u(head[1]),S*.035,0,7); c.fill(); }
    /* when idle, a little star shows the way */
    if(!TR.down&&now-TR.idle>1800){ const f=((now-TR.idle)%1800)/1800, j=Math.floor(TR.k+(P.length-1-TR.k)*f), g=P[Math.max(0,Math.min(P.length-1,j))]; c.globalAlpha=1-f*.6; c.font=`${S*.07}px serif`; c.fillText("⭐",u(g[0]),u(g[1])); c.globalAlpha=1; }
  } else if(it.fin){ c.font=`${S*.3}px serif`; c.fillText(it.fin,S/2,S/2+(it.fin==="🌈"?S*.08:0)); }
}

function openTopic(key){ const T=TOPICS[key]; cur={T,idx:0,recent:[]}; enter(T.title); teach(); }
function teach(){
  stopAll(); const it=cur.T.items[cur.idx]; cur.resume=teach;
  stage.innerHTML=`<div class="face pop">${it.face()}</div>${spellRow(it.word)}<div class="cap">${it.cap()}</div>`;
  later(()=>play(it.teach(),()=>later(afterTeach,1300)),250);
}
function afterTeach(){ cur.recent.push(cur.T.items[cur.idx]); cur.idx=(cur.idx+1)%cur.T.items.length;
  if(cur.recent.length>=3){ const pool=cur.recent; cur.recent=[]; quiz(pool,teach); } else teach(); }
function quiz(pool,next,ans=pool[rand(pool.length)]){
  stopAll(); cur.resume=()=>quiz(pool,next,ans);
  const opts=shuffle(pool); let asks=0, wt=null;
  stage.innerHTML=`<div class="q">${ans.q()}</div><div class="choices">${opts.map((o,i)=>`<button data-i="${i}" aria-label="${o.nm()}">${o.choice}</button>`).join("")}</div>`;
  const btns=[...stage.querySelectorAll(".choices button")];
  const wait=()=>{ clearTimeout(wt); wt=later(()=>{ if(asks<3) ask(); else hint(); },9000); };
  const ask=()=>{ asks++; play([{t:ans.q(),l:L_()}],wait); };
  const hint=()=>{ btns[opts.indexOf(ans)].classList.add("bounce"); play([{t:H()?`${ans.nm()} यहाँ है!`:`Here it is! ${ans.nm()}!`,l:L_()}],()=>later(next,1600)); };
  btns.forEach(b=>b.onclick=()=>{ const o=opts[+b.dataset.i];
    if(o===ans){ stopAll(); btns.forEach(x=>x.disabled=true); b.classList.remove("bounce"); b.classList.add("right"); anim(b,"pop"); cheer(); burstAt(b);
      play([{t:H()?`शाबाश! ${ans.nm()}!`:`Yay! ${ans.nm()}! Good job!`,l:L_()}],()=>later(next,900)); }
    else { stopAll(); anim(b,"shake"); play([{t:H()?`यह ${o.nm()} है।`:`That is ${o.nm()}.`,l:L_(),gap:300},{t:ans.q(),l:L_()}],wait); } });
  later(ask,300);
}

function feed(){

  stage.innerHTML=`<div class="q">${H()?`${a[2]} को ${a[5]} खिलाओ`:`Feed the ${a[0]}`}</div><div class="eater" id="eater">${a[1]}</div><div class="foods">${foods.map((f,i)=>`<button class="food" data-i="${i}" aria-label="${f[3]}">${f[4]}</button>`).join("")}</div>`;
  const eater=$("eater"); let wt=null, asks=0, done=false;

  const say=()=>{ asks++; play([{t:ask,l:L_()}],wait); };

    b.classList.remove("bounce","drag"); b.classList.add("eaten"); b.style.transform=`translate(${er.left+er.width/2-br.left-br.width/2+(b._dx||0)}px,${er.top+er.height/2-br.top-br.height/2+(b._dy||0)}px) scale(.3)`;
    later(()=>{ anim(eater,"wiggle"); cheer(); burstAt(eater); play([{t:H()?`यम यम! ${a[2]} को ${a[5]} पसंद है!`:`Yum yum! The ${a[0]} loves the ${a[3]}!`,l:L_()}],()=>later(feed,1200)); },350); };
  const wrong=(b,f)=>{ stopAll(); anim(b,"shake"); play([{t:H()?`नहीं नहीं! ${a[2]} को ${a[5]} चाहिए।`:`No no! The ${a[0]} wants the ${a[3]}.`,l:L_()}],wait); };
  stage.querySelectorAll(".food").forEach(b=>{
    const f=foods[+b.dataset.i]; let sx=0, sy=0, moved=false;
    b.addEventListener("pointerdown",e=>{ if(done) return; b.setPointerCapture(e.pointerId); sx=e.clientX; sy=e.clientY; moved=false; b._dx=0; b._dy=0; b.classList.remove("back","bounce"); b.classList.add("drag"); });

    const end=e=>{ if(!b.classList.contains("drag")) return; b.classList.remove("drag"); eater.classList.remove("near");

      if(over&&f===a){ success(b); return; }
      b.classList.add("back"); b.style.transform=""; if(over) wrong(b,f); };
    b.addEventListener("pointerup",end); b.addEventListener("pointercancel",end);
  });
  later(say,300);
}
