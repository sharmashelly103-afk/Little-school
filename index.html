<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8A5CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baby Sparkle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<title>Baby Sparkle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;700;800&family=Comic+Neue:wght@700&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: a sunny storybook world — animated sky, rainbow and hills sit behind everything; content floats on soft white "cloud" panels. One bright theme on purpose (a toy). */
:root{
  --sky1:#7CCBFF; --sky2:#BDE7FF; --sky3:#FFF4D9;
  --ink:#24214A; --card:#FFFFFFEE; --soft:#D9E8F6; --paper:#FFFDF6; --bg:#F1F7FF;
  --sun:#FFC83D; --berry:#FF4F8B; --leaf:#22B573; --sky:#3E8EFF; --grape:#8A5CFF; --tang:#FF7A33; --teal:#14B3B8;
  --display:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky2);color:var(--ink);font-family:var(--font,var(--display));-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none;overflow-x:hidden}
button{font-family:var(--font,var(--display));color:inherit}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}

/* ---------- living background ---------- */
#world{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%)}
#world svg{position:absolute;inset:0;width:100%;height:100%}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.rays{transform-origin:88% 12%;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.balloon{position:absolute;bottom:-140px;font-size:46px;animation:floatup linear infinite;opacity:.9}
@keyframes floatup{0%{transform:translate(0,0)}50%{transform:translate(24px,-60vh)}100%{transform:translate(-10px,-125vh)}}
.sway{transform-origin:bottom center;animation:sw 3s ease-in-out infinite}
@keyframes sw{50%{transform:rotate(6deg)}}

.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:14px}
/* ---------- home ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg.logo{width:68px;height:68px;flex:none;filter:drop-shadow(0 5px 0 rgba(36,33,74,.18))}
.word{display:flex;flex-direction:column;line-height:.9}
.word b{font-size:clamp(1.9rem,8vw,2.8rem);font-weight:800;letter-spacing:.01em;display:flex}
.word b span{display:inline-block;animation:bob 2.6s ease-in-out infinite;text-shadow:0 3px 0 rgba(36,33,74,.18)}
@keyframes bob{50%{transform:translateY(-4px)}}
.word small{font-size:.92rem;font-weight:700;color:#3B4A7A;opacity:.85;padding-left:3px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:4px;box-shadow:0 4px 0 rgba(36,33,74,.12)}
.pill button{font-weight:700;font-size:.95rem;border:0;border-radius:999px;padding:7px 13px;background:transparent;cursor:pointer}
.pill button[aria-pressed="true"]{background:var(--ink);color:#fff}
.iconbtn{width:46px;height:46px;border:0;border-radius:50%;background:var(--card);box-shadow:0 4px 0 rgba(36,33,74,.12);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.note{background:#FFF4D6;border-radius:18px;padding:10px 14px;font-weight:600;margin:0}
.shelf{background:var(--card);border-radius:30px;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 rgba(36,33,74,.10);backdrop-filter:blur(4px)}
.shelf h2{margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:1.3rem;font-weight:800}
.shelf h2 .tab{color:#fff;padding:2px 14px 0;border-radius:999px;box-shadow:0 3px 0 rgba(36,33,74,.15)}
.shelf h2 small{font-size:.85rem;font-weight:600;opacity:.65}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.card{position:relative;border:0;border-radius:24px;padding:10px 6px 9px;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 78%,#fff) 0%,var(--c) 70%);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 70%,#000)}
.card::after{content:"";position:absolute;top:-30%;left:-20%;width:70%;height:60%;background:radial-gradient(closest-side,rgba(255,255,255,.45),transparent);pointer-events:none}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 70%,#000)}
.card i{font-style:normal;font-size:2.6rem;line-height:1.15;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center}
.card b{font-size:1.08rem;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.12);text-align:center}
.card small{font-size:.76rem;font-weight:600;opacity:.95;text-align:center;line-height:1.1}
/* ---------- play ---------- */
.bar{display:flex;align-items:center;gap:10px}
.bar h1{flex:1;margin:0;text-align:center;font-size:clamp(1.25rem,5vw,1.8rem);font-weight:800;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.7)}
.back{height:54px;border:0;border-radius:999px;background:var(--berry);color:#fff;font-weight:800;font-size:1.15rem;padding:0 18px 0 12px;display:flex;align-items:center;gap:4px;cursor:pointer;box-shadow:0 5px 0 #C02A61}
.back span{font-size:1.5rem;line-height:1}
.round{width:54px;height:54px;flex:none;border:0;border-radius:50%;background:var(--card);box-shadow:0 4px 0 rgba(36,33,74,.15);font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stage{background:var(--card);border-radius:32px;min-height:min(72vh,620px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;position:relative;overflow:hidden;box-shadow:0 8px 0 rgba(36,33,74,.10)}
.pic{font-size:clamp(5.5rem,28vw,9rem);line-height:1.1}
.big{font-size:clamp(5.5rem,28vw,9.5rem);line-height:1;font-weight:800}
.big small{font-size:.55em}
.blob{width:min(180px,46vw);aspect-ratio:1;max-width:100%;border-radius:50%;box-shadow:0 10px 0 rgba(0,0,0,.1),inset 0 0 0 4px rgba(0,0,0,.06)}
.shape{width:min(200px,50vw);aspect-ratio:1;max-width:100%}
.shape svg{width:100%;height:100%}
.spell{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.spell span{min-width:42px;height:52px;padding-inline:6px;border-radius:14px;background:var(--bg);font-size:1.9rem;font-weight:800;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.spell span.on{background:var(--sun);transform:scale(1.22) translateY(-4px)}
.spell.all span{background:var(--leaf);color:#fff}
.nameplate{font-size:clamp(2.2rem,10vw,3.4rem);font-weight:800;line-height:1;color:var(--c,var(--berry));text-shadow:0 3px 0 rgba(36,33,74,.12)}
.cap{font-size:clamp(1.1rem,4.6vw,1.5rem);font-weight:700;opacity:.8;min-height:1.4em;max-width:30ch;text-wrap:balance}
.sayit{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.3rem;color:var(--grape);background:#F1EBFF;border-radius:999px;padding:4px 16px}
.sayit i{font-style:normal;font-size:1.8rem;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.objs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:520px}
.objs span{font-size:clamp(2.2rem,10vw,3.2rem);opacity:.18;transition:opacity .2s,transform .2s;position:relative}
.objs.shown span{opacity:1}
.objs span.on{opacity:1;transform:scale(1.25)}
.objs span b{position:absolute;top:-8px;right:-6px;background:var(--grape);color:#fff;font-size:.9rem;border-radius:999px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.q{font-size:clamp(1.6rem,6.6vw,2.5rem);font-weight:800;line-height:1.1;text-wrap:balance}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:560px}
.choices button{aspect-ratio:1;max-width:100%;border:0;border-radius:26px;background:var(--bg);font-size:clamp(3rem,15vw,5rem);font-weight:800;cursor:pointer;box-shadow:0 6px 0 var(--soft);display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.choices button svg{width:80%;height:80%}
.choices .dot{display:block;width:72%;aspect-ratio:1;border-radius:50%}
.choices button.right{background:#D9F7E8;box-shadow:0 6px 0 var(--leaf)}
.choices.two{grid-template-columns:repeat(2,1fr);max-width:440px}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.bounce{animation:bnc .6s infinite}
@keyframes bnc{50%{transform:translateY(-14px) scale(1.06)}}
.wiggle{animation:wig .6s}
@keyframes wig{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
.burst{position:absolute;pointer-events:none;font-size:1.8rem;animation:fly 1s ease-out forwards;z-index:9}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(220deg);opacity:0}}
.score{position:absolute;top:12px;left:16px;font-weight:800;font-size:1.3rem;z-index:4}
.starbar{position:absolute;top:10px;right:14px;font-weight:800;font-size:1.2rem;background:#FFF4D6;border-radius:999px;padding:2px 12px;z-index:4}

/* ---------- reveal stages (each item in Seekho arrives a different way) ---------- */
.rv{position:relative;width:min(300px,74vw);aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rv .item{font-size:clamp(6rem,30vw,9.5rem);line-height:1;opacity:0;transform:scale(.3);transition:transform .55s cubic-bezier(.2,1.6,.4,1),opacity .3s}
.rv.open .item{opacity:1;transform:scale(1)}
.rv .hint{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:2.2rem;animation:pulse 1s infinite}
.rv.open .hint{display:none}
/* gift */
.giftbox{position:absolute;inset:14%;}
.giftbox .boxb{position:absolute;left:0;right:0;bottom:0;height:68%;border-radius:16px;background:var(--gc,#FF4F8B);box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.giftbox .lid{position:absolute;left:-6%;right:-6%;top:18%;height:20%;border-radius:12px;background:color-mix(in srgb,var(--gc,#FF4F8B) 80%,#fff);transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-origin:10% 100%}
.giftbox .rib{position:absolute;left:44%;width:12%;top:18%;bottom:0;background:var(--sun)}
.giftbox .bow{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-size:2.4rem;transition:transform .5s}
.rv:not(.open) .giftbox{animation:giftshake 1.6s infinite}
@keyframes giftshake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-6deg)}85%{transform:rotate(6deg)}92%{transform:rotate(-3deg)}}
.rv.open .giftbox .lid{transform:translate(-30%,-90%) rotate(-40deg)}
.rv.open .giftbox .bow{transform:translate(-160%,-160%) rotate(-40deg)}
.rv.open .giftbox{opacity:.0;transition:opacity .4s .5s}
/* curtain */
.curt{position:absolute;inset:0;display:flex;overflow:hidden;border-radius:24px;border-top:14px solid #B8324A}
.curt i{flex:1;background:repeating-linear-gradient(90deg,#E8455E 0 18px,#D23A52 18px 30px);transition:transform .7s ease-in-out}
.rv.open .curt i:first-child{transform:translateX(-96%)}
.rv.open .curt i:last-child{transform:translateX(96%)}
/* balloon */
.bal{position:absolute;left:50%;top:6%;transform:translateX(-50%);width:62%;aspect-ratio:.85;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 32% 30%,#fff8 0 10%,transparent 11%),var(--gc,#3E8EFF);box-shadow:inset -10px -12px 0 rgba(0,0,0,.1);animation:bfloat 2s ease-in-out infinite}
.bal::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:60px;background:#7a7a9a}
@keyframes bfloat{50%{transform:translate(-50%,-10px)}}
.rv.open .bal{animation:balpop .3s forwards}
@keyframes balpop{to{transform:translateX(-50%) scale(1.6);opacity:0}}
/* truck */
.truckr{position:absolute;bottom:8%;left:0;font-size:5.4rem;animation:drivein 1.6s ease-out forwards;transform:scaleX(-1)}
@keyframes drivein{from{left:-80%}to{left:18%}}
.rv .road{position:absolute;bottom:4%;left:-10%;right:-10%;height:10px;border-radius:5px;background:repeating-linear-gradient(90deg,#9AA6BF 0 30px,transparent 30px 46px)}
.rv.t-truck .item{position:absolute;top:4%}
.rv.open .truckr{animation:driveout 1s ease-in forwards}
@keyframes driveout{from{left:18%}to{left:130%}}
/* bubble */
.bub{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.9) 0 8%,transparent 9%),radial-gradient(circle,rgba(160,220,255,.25) 55%,rgba(120,180,255,.55) 100%);box-shadow:inset 0 0 30px rgba(255,255,255,.8);animation:bfloat2 2.4s ease-in-out infinite}
@keyframes bfloat2{50%{transform:translateY(-8px) scale(1.02)}}
.rv.t-bubble .item{opacity:.55;transform:scale(.8)}
.rv.open .bub{animation:balpop2 .3s forwards}
@keyframes balpop2{to{transform:scale(1.5);opacity:0}}
/* shadow */
.rv.t-shadow .item{opacity:1;transform:scale(1);filter:brightness(0) opacity(.8);transition:filter .8s}
.rv.t-shadow.open .item{filter:none}
/* magic hat */
.hat{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:7rem;line-height:1}
.rv.t-hat .item{transform:translateY(60%) scale(.3)}
.rv.t-hat.open .item{transform:translateY(-12%) scale(1)}
.wand{position:absolute;right:4%;top:20%;font-size:3rem;animation:wave 1s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-25deg)}}

/* ---------- sound boards ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;width:100%;align-self:stretch}
.board button{aspect-ratio:1;max-width:100%;border:0;border-radius:24px;background:var(--bg);font-size:clamp(2.8rem,13vw,3.6rem);cursor:pointer;box-shadow:0 5px 0 var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.board button small{font-size:.85rem;font-weight:700}
.board button.on{background:#FFF1C2;box-shadow:0 5px 0 var(--sun)}
.head{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;max-width:100%}
.head .cell{width:clamp(48px,14vw,68px);height:clamp(48px,14vw,68px);border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,9vw,2.6rem)}
.head .cell.ask{background:#FFF1C2;box-shadow:inset 0 0 0 3px var(--sun);font-weight:800;color:var(--tang)}
.head .dot{display:block;width:70%;aspect-ratio:1;border-radius:50%}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:clamp(1.4rem,6vw,2rem);line-height:1}
.tower{display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;height:100%;gap:2px;font-size:clamp(1.1rem,5vw,1.6rem);line-height:1}
.silh{filter:brightness(0) opacity(.85)}
.pair{display:flex;align-items:flex-end;justify-content:center;gap:18px}
.pair .pic.small{font-size:clamp(3rem,15vw,4.6rem)}
/* tracing */
.tracewrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
#cv{width:min(100%,58vh);aspect-ratio:1;max-width:100%;background:var(--paper);border-radius:24px;touch-action:none;box-shadow:inset 0 0 0 3px var(--soft)}
.tctl{display:flex;gap:14px;justify-content:center}
.tctl button{width:64px;height:64px;border:0;border-radius:50%;background:var(--bg);font-size:1.7rem;cursor:pointer;box-shadow:0 4px 0 var(--soft)}
.tlabel{font-size:clamp(1.3rem,5vw,1.8rem);font-weight:800;min-height:1.3em}
.overlay{position:absolute;inset:0;background:rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:6}
.strip{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:4px 2px 8px;scrollbar-width:none}
.strip button{flex:none;min-width:44px;height:44px;border:0;border-radius:12px;background:var(--bg);font-weight:800;font-size:1.25rem;cursor:pointer;padding-inline:8px}
.strip button[aria-current="true"]{background:var(--ink);color:#fff}
.strip button.done{box-shadow:inset 0 -4px 0 var(--leaf)}
/* bubbles game */
.field{position:absolute;inset:0}
.target{position:absolute;top:10px;left:0;right:0;z-index:4;font-weight:800;font-size:clamp(1.3rem,5.5vw,1.8rem);display:flex;justify-content:center;align-items:center;gap:8px;pointer-events:none}
.target .dot{width:34px;height:34px;border-radius:50%;display:inline-block}
.bubble{position:absolute;bottom:-120px;width:100px;height:100px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:2.8rem;font-weight:800;color:#fff;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.85) 0 11%,transparent 12%),var(--c);opacity:.95;animation:rise var(--t) linear forwards;box-shadow:inset -6px -8px 0 rgba(0,0,0,.08)}
@keyframes rise{to{transform:translate(var(--sway),var(--h))}}
.bubble.gone{animation:out .25s forwards}
@keyframes out{to{transform:scale(1.7);opacity:0}}
/* feed */
.eater{width:min(220px,56vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:clamp(5rem,26vw,8rem);box-shadow:inset 0 0 0 6px var(--soft);transition:box-shadow .2s}
.eater.near{box-shadow:inset 0 0 0 8px var(--leaf)}
.foods{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.food{width:86px;height:86px;border:0;border-radius:24px;background:var(--paper);font-size:3.4rem;cursor:grab;box-shadow:0 5px 0 var(--soft);touch-action:none;position:relative;z-index:5}
.food.drag{cursor:grabbing;z-index:8;box-shadow:0 14px 24px rgba(36,33,74,.25)}
.food.back{transition:transform .3s}
.food.eaten{transition:transform .35s,opacity .35s;opacity:0}
/* tap tap */
.tapzone{position:absolute;inset:0;touch-action:none;cursor:pointer}
.tapitem{position:absolute;font-size:clamp(4rem,20vw,6.5rem);pointer-events:none;transform:translate(-50%,-50%);animation:tapin 2.2s ease-out forwards;display:flex;flex-direction:column;align-items:center}
.tapitem b{font-size:1.4rem;background:var(--ink);color:#fff;border-radius:999px;padding:0 12px;line-height:1.6}
@keyframes tapin{0%{transform:translate(-50%,-50%) scale(.2)}15%{transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.taphint{font-size:clamp(1.6rem,7vw,2.4rem);font-weight:800;opacity:.35;pointer-events:none}
/* music */
.xylo{display:flex;align-items:flex-end;justify-content:center;gap:6px;width:100%;max-width:560px;height:240px}
.xylo button{flex:1;border:0;border-radius:14px;cursor:pointer;color:#fff;font-weight:800;font-size:1.1rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;box-shadow:0 5px 0 rgba(36,33,74,.2);transition:transform .08s}
.xylo button.hit{transform:translateY(6px);filter:brightness(1.2)}
.songs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.songs button{font-weight:700;font-size:1.05rem;border:0;border-radius:999px;padding:10px 18px;background:var(--ink);color:#fff;cursor:pointer}
/* sorting */
.sortrow{display:flex;gap:14px;width:100%;justify-content:center}
.basket{flex:1;max-width:220px;min-height:150px;border-radius:26px;background:var(--bg);box-shadow:inset 0 0 0 4px var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px 6px;gap:4px;cursor:pointer;border:0;transition:box-shadow .2s}
.basket.near{box-shadow:inset 0 0 0 6px var(--leaf)}
.basket i{font-style:normal;font-size:2.6rem;line-height:1}
.basket b{font-size:1.15rem}
.basket .in{display:flex;flex-wrap:wrap;justify-content:center;font-size:1.4rem;gap:2px}
.sortee{width:112px;height:112px;border:0;border-radius:28px;background:var(--paper);font-size:4.4rem;box-shadow:0 6px 0 var(--soft);touch-action:none;cursor:grab;position:relative;z-index:5}
.sortee.drag{z-index:8;box-shadow:0 14px 24px rgba(36,33,74,.25)}
.sortee.back{transition:transform .3s}
/* colouring */
.colorwrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.colorwrap svg{width:min(100%,52vh);height:auto;aspect-ratio:1;max-width:100%;background:var(--paper);border-radius:24px;touch-action:manipulation}
.colorwrap svg .rg{cursor:pointer;stroke:#24214A;stroke-width:3;stroke-linejoin:round;transition:fill .25s}
.palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.palette button{width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.palette button[aria-pressed="true"]{transform:scale(1.2);box-shadow:0 0 0 4px var(--ink)}
/* jigsaw & memory */
.jig{display:grid;grid-template-columns:repeat(2,var(--p));gap:4px;padding:4px;border-radius:18px;background:var(--bg);position:relative}
.slot{width:var(--p);height:var(--p);border-radius:12px;position:relative;box-shadow:inset 0 0 0 2px var(--soft);overflow:hidden;cursor:pointer}
.slot .ghost{position:absolute;inset:0;opacity:.18;transition:opacity .3s}
.slot.filled .ghost{opacity:1}
.pieces{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.piece{border:0;border-radius:12px;cursor:grab;touch-action:none;box-shadow:0 5px 0 var(--soft);background-color:var(--paper);position:relative;z-index:5}
.piece.sel{box-shadow:0 0 0 4px var(--sun)}
.piece.drag{z-index:8}
.piece.back{transition:transform .3s}
.mem{display:grid;gap:10px;width:100%;max-width:460px}
.mem button{aspect-ratio:1;max-width:100%;border:0;border-radius:22px;cursor:pointer;font-size:clamp(2.6rem,13vw,3.6rem);background:var(--grape);color:#fff;box-shadow:0 5px 0 rgba(36,33,74,.2);transition:transform .25s,background .25s}
.mem button.open{background:var(--paper);color:var(--ink)}
.mem button.got{background:#D9F7E8;box-shadow:0 5px 0 var(--leaf)}

/* ---------- Sparky the cartoon kid (move & body games) ---------- */
.kid{width:min(300px,70vw);max-width:100%;height:auto;overflow:visible}
.kid .pt{transition:filter .2s}
.kid.tapme .pt{cursor:pointer}
.kid .pt.glow{animation:glow .45s 3}
@keyframes glow{50%{filter:brightness(1.35) drop-shadow(0 0 10px #FFD23D) drop-shadow(0 0 4px #FFD23D)}}
.kid .armL{transform-origin:72px 150px}
.kid .armR{transform-origin:168px 150px}
.kid .legL{transform-origin:104px 232px}
.kid .legR{transform-origin:136px 232px}
.kid .whole{transform-origin:120px 200px}
.mv-clap .armL{animation:clapL .5s ease-in-out infinite}
.mv-clap .armR{animation:clapR .5s ease-in-out infinite}
@keyframes clapL{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-115deg)}}
@keyframes clapR{0%,100%{transform:rotate(20deg)}50%{transform:rotate(115deg)}}
.mv-jump .whole{animation:jump .6s cubic-bezier(.3,0,.5,1) infinite}
.mv-jump .armL{animation:up1 .6s infinite}.mv-jump .armR{animation:up2 .6s infinite}
@keyframes jump{0%,100%{transform:translateY(0) scaleY(.94)}45%{transform:translateY(-70px) scaleY(1.03)}}
@keyframes up1{0%,100%{transform:rotate(0)}45%{transform:rotate(150deg)}}
@keyframes up2{0%,100%{transform:rotate(0)}45%{transform:rotate(-150deg)}}
.mv-walk .whole{animation:walkb .7s ease-in-out infinite}
.mv-walk .legL,.mv-march .legL{animation:stepL .7s ease-in-out infinite}
.mv-walk .legR,.mv-march .legR{animation:stepR .7s ease-in-out infinite}
.mv-walk .armL{animation:stepR .7s ease-in-out infinite}.mv-walk .armR{animation:stepL .7s ease-in-out infinite}
@keyframes walkb{50%{transform:translateY(-6px)}}
@keyframes stepL{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
@keyframes stepR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
.mv-march .armL{animation:up1 .7s infinite}.mv-march .armR{animation:up2 .7s .35s infinite}
.mv-march .legL{animation:knee .7s infinite}.mv-march .legR{animation:knee .7s .35s infinite}
@keyframes knee{0%,100%{transform:rotate(0)}50%{transform:rotate(-55deg) translateY(-6px)}}
.mv-hop .whole{animation:hop .5s ease-in-out infinite}
.mv-hop .legR{transform:rotate(-80deg)}
.mv-hop .armL{transform:rotate(60deg)}.mv-hop .armR{transform:rotate(-60deg)}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-40px)}}
.mv-skip .whole{animation:skip 1s ease-in-out infinite}
.mv-skip .legL{animation:knee 1s infinite}.mv-skip .legR{animation:knee 1s .5s infinite}
.mv-skip .armL{animation:stepL .5s infinite}.mv-skip .armR{animation:stepR .5s infinite}
@keyframes skip{0%,100%{transform:translate(-30px,0)}25%{transform:translate(-10px,-34px)}50%{transform:translate(10px,0)}75%{transform:translate(30px,-34px)}}
.mv-roll .whole{animation:roll 1.4s ease-in-out infinite}
.mv-roll .armL{transform:rotate(140deg)}.mv-roll .armR{transform:rotate(-140deg)}
@keyframes roll{0%{transform:translateX(-60px) rotate(0)}100%{transform:translateX(60px) rotate(360deg)}}
.mv-spin .whole{animation:spinme 1.2s linear infinite}
.mv-spin .armL{transform:rotate(80deg)}.mv-spin .armR{transform:rotate(-80deg)}
@keyframes spinme{0%{transform:scaleX(1)}25%{transform:scaleX(.2)}50%{transform:scaleX(-1)}75%{transform:scaleX(-.2)}100%{transform:scaleX(1)}}
.mv-wave .armR{animation:wavehand .5s ease-in-out infinite}
@keyframes wavehand{0%,100%{transform:rotate(-140deg)}50%{transform:rotate(-170deg)}}
.mv-stretch .armL{animation:up1 1.6s ease-in-out infinite}.mv-stretch .armR{animation:up2 1.6s ease-in-out infinite}
.mv-stretch .whole{animation:tall 1.6s ease-in-out infinite}
@keyframes tall{50%{transform:scaleY(1.08) translateY(-8px)}}
.mv-toes .whole{animation:bend 1.6s ease-in-out infinite}
@keyframes bend{50%{transform:rotate(0) translateY(20px) scaleY(.85)}}
.mv-toes .armL{animation:reach1 1.6s ease-in-out infinite}.mv-toes .armR{animation:reach2 1.6s ease-in-out infinite}
@keyframes reach1{50%{transform:rotate(-25deg)}}
@keyframes reach2{50%{transform:rotate(25deg)}}
.mv-stomp .legL{animation:stomp .8s infinite}.mv-stomp .legR{animation:stomp .8s .4s infinite}
@keyframes stomp{0%,100%{transform:translateY(0)}25%{transform:translateY(-22px)}40%{transform:translateY(0)}}
.mv-tiptoe .whole{animation:tip 1s ease-in-out infinite}
.mv-tiptoe .armL{transform:rotate(40deg)}.mv-tiptoe .armR{transform:rotate(-40deg)}
@keyframes tip{50%{transform:translateY(-14px)}}
.mv-dance .whole{animation:dance .8s ease-in-out infinite}
.mv-dance .armL{animation:up1 .8s infinite}.mv-dance .armR{animation:up2 .8s .4s infinite}
.mv-dance .legL{animation:stepL .8s infinite}.mv-dance .legR{animation:stepR .8s infinite}
@keyframes dance{25%{transform:rotate(-8deg) translateX(-10px)}75%{transform:rotate(8deg) translateX(10px)}}
.mv-shake .whole{animation:wig .4s infinite}
.mv-shake .armL{animation:clapL .3s infinite}.mv-shake .armR{animation:clapR .3s infinite}
.mv-sit .whole{animation:sit 2s ease-in-out infinite}
@keyframes sit{0%,100%{transform:translateY(0)}50%{transform:translateY(40px) scaleY(.82)}}
.movebtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bigbtn{border:0;border-radius:999px;padding:12px 24px;font-weight:800;font-size:1.25rem;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.counter{font-size:clamp(3rem,16vw,5rem);font-weight:800;color:var(--tang);min-height:1.1em;line-height:1}

/* ---------- parent lock ---------- */
.gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(36,33,74,.35);backdrop-filter:blur(6px)}
.gatecard{background:#fff;border-radius:30px;padding:22px 18px;max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 10px 0 rgba(36,33,74,.15)}
.gatecard svg.logo{width:92px;height:92px}
.gatecard h3{margin:0;font-size:1.5rem;font-weight:800}
.gatecard p{margin:0;font-weight:600;opacity:.75}
.eq{font-size:2.6rem;font-weight:800;display:flex;align-items:center;gap:10px}
.eq .ans{min-width:62px;height:62px;border-radius:16px;border:3px dashed var(--grape);display:flex;align-items:center;justify-content:center;color:var(--grape)}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.keypad button{height:56px;border:0;border-radius:16px;background:var(--bg);font-size:1.6rem;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--soft)}
.gate .cancel{border:0;background:none;font-weight:700;font-size:1rem;color:#5B6690;cursor:pointer;padding:6px}
.bye{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,#7CCBFF,#FFF4D9);text-align:center;padding:16px}
/* ---------- world scenes ---------- */
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene[data-w="jungle"]{background:linear-gradient(180deg,#A6EBCB 0%,#D6F5B8 55%,#86CF6E 100%)}
.scene[data-w="ocean"]{background:linear-gradient(180deg,#8EE0F7 0%,#3C9DE0 50%,#1E5EA8 100%)}
.scene[data-w="space"]{background:radial-gradient(circle at 70% 20%,#4B3A9A 0%,#2A2468 45%,#141638 100%)}
.scene[data-w="fantasy"]{background:linear-gradient(180deg,#FFD6EC 0%,#E9D8FF 55%,#CDEBFF 100%)}
.scene[data-w="art"]{background:#FFF4E2}
.drift{position:absolute;left:-12%;font-size:44px;animation:driftx linear infinite}
.drift.rev{left:auto;right:-12%;animation-name:driftr}
@keyframes driftx{0%{transform:translate(0,0)}50%{transform:translate(60vw,-30px)}100%{transform:translate(125vw,0)}}
@keyframes driftr{0%{transform:translate(0,0) scaleX(-1)}50%{transform:translate(-60vw,30px) scaleX(-1)}100%{transform:translate(-125vw,0) scaleX(-1)}}
.risebub{animation:bubup linear infinite}
@keyframes bubup{from{transform:translateY(0)}to{transform:translateY(-1100px)}}
.shoot{animation:shoot 7s ease-in infinite;opacity:0}
@keyframes shoot{0%,80%{transform:translate(100px,80px);opacity:0}84%{opacity:1}100%{transform:translate(700px,300px);opacity:0}}
body[data-w="space"] .word small,body[data-w="space"] .bar h1{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
body[data-w="ocean"] .bar h1{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
/* ---------- world dropdowns on home ---------- */
.world{border:0;width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:26px;color:#fff;cursor:pointer;text-align:left;
  background:linear-gradient(120deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c));box-shadow:0 6px 0 color-mix(in srgb,var(--c) 65%,#000)}
.world:active{transform:translateY(3px)}
.world i{font-style:normal;font-size:2.3rem;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex:none}
.world .wt{flex:1;min-width:0}
.world b{display:block;font-size:1.32rem;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.world small{display:block;font-size:.86rem;font-weight:600;opacity:.95;line-height:1.2}
.world .cnt{font-size:.8rem;font-weight:800;background:rgba(255,255,255,.28);border-radius:999px;padding:2px 9px;flex:none}
.world .chev{font-size:1.2rem;transition:transform .25s;flex:none}
.world[aria-expanded="true"] .chev{transform:rotate(180deg)}
.wbody{background:var(--card);border-radius:26px;padding:12px;margin-top:-6px;box-shadow:0 6px 0 rgba(36,33,74,.10)}
.hl{display:block;font-size:.66em;opacity:.8;font-weight:700;line-height:1.15}
.card.locked{filter:grayscale(.85);opacity:.6}
.card .lk{position:absolute;top:6px;right:8px;font-size:1.05rem;z-index:2}
/* ---------- game controls ---------- */
.ctl{display:flex;justify-content:center;gap:12px;background:var(--card);border-radius:999px;padding:8px 14px;align-self:center;box-shadow:0 5px 0 rgba(36,33,74,.12)}
.ctl button{width:58px;height:58px;border:0;border-radius:50%;font-size:1.45rem;cursor:pointer;background:var(--bg);box-shadow:0 4px 0 var(--soft);display:flex;align-items:center;justify-content:center}
.ctl button:disabled{opacity:.3;cursor:default}
.ctl #cPause{background:var(--berry);color:#fff;box-shadow:0 4px 0 #C02A61}
.ctl button.nudge{animation:pulse 1s infinite;background:#FFF1C2;box-shadow:0 4px 0 var(--sun)}
/* ---------- settings ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(36,33,74,.4);backdrop-filter:blur(6px);overflow-y:auto;padding:16px}
.sheetcard{max-width:660px;margin:0 auto;background:#fff;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheethead h3{margin:0;font-size:1.6rem}
.sec{border-radius:20px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-size:1.12rem;display:flex;gap:8px;align-items:center}
.sec p{margin:0;font-size:.9rem;font-weight:600;opacity:.7}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:0;border-radius:14px;padding:8px 12px;background:#fff;font-weight:700;font-size:.98rem;cursor:pointer;box-shadow:0 3px 0 var(--soft);display:flex;align-items:center;gap:6px}
.opt[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #000}
.swatch{width:26px;height:26px;border-radius:8px;display:inline-block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.1)}
.prof{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 10px;flex-wrap:wrap}
.prof .av{font-size:2rem}
.prof .pn{flex:1;min-width:120px;font-weight:800}
.sheetcard input[type=text]{font:700 1.1rem var(--display);padding:10px 12px;border-radius:12px;border:2px solid var(--soft);width:100%;max-width:280px}
.sheetcard input[type=range]{width:100%;max-width:300px;accent-color:#8A5CFF}
.rowlab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.rowlab span{min-width:90px}
.lockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.lockrow{display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:6px 8px;border:0;font:700 .92rem var(--display);cursor:pointer;text-align:left}
.lockrow[aria-pressed="true"]{background:#FFE3EC}
.closebtn{border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:1.05rem;padding:10px 18px;cursor:pointer}
/* free paint, peekaboo, car wash, fish, piano */
#paint{width:min(100%,62vh);aspect-ratio:1;max-width:100%;border-radius:24px;touch-action:none;background:#fff;box-shadow:inset 0 0 0 3px var(--soft)}
#wash{touch-action:none}
.washwrap{position:relative;width:min(100%,62vh);max-width:100%;aspect-ratio:1}
.washwrap .car{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(7rem,40vw,12rem);border-radius:24px;background:linear-gradient(#DFF4FF,#BFE6FF)}
.washwrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:24px}
.bushes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:520px}
.bush{position:relative;aspect-ratio:1;max-width:100%;border:0;background:none;cursor:pointer;padding:0}
.bush .leaf{position:absolute;inset:18% 0 0 0;border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 30% 30%,#7DDB6E,#2E9E50);transition:transform .35s cubic-bezier(.3,1.5,.5,1);z-index:2}
.bush .who{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(2.6rem,13vw,4rem);transform:translateY(30%) scale(.6);opacity:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s;z-index:1}
.bush.open .who{transform:translateY(-22%);opacity:1}
.bush.open .leaf{transform:translateY(22%)}
.pond{position:relative;width:100%;height:min(56vh,440px);border-radius:26px;background:linear-gradient(#8EE0F7,#2F8FD6);overflow:hidden}
.fish{position:absolute;font-size:3.2rem;border:0;background:none;cursor:pointer;animation:swim linear forwards;padding:0}
@keyframes swim{from{transform:translateX(var(--from)) scaleX(var(--dir))}to{transform:translateX(var(--to)) scaleX(var(--dir))}}
.net{font-size:2.4rem;font-weight:800}
.piano{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:560px}
.piano button{aspect-ratio:.8;max-width:100%;border:0;border-radius:20px;color:#fff;font-size:clamp(2.4rem,12vw,3.4rem);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.piano button small{font-size:.8rem;font-weight:800}
.piano button.hit{transform:translateY(5px);filter:brightness(1.15)}
.brushes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.brushes button{width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;font-size:1.4rem;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.brushes button[aria-pressed="true"]{transform:scale(1.2);box-shadow:0 0 0 4px var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}

function loadTrace(){

function sizeCanvas(){ const cv=$("cv"); const r=cv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1); TR.S=r.width; cv.width=r.width*dpr; cv.height=r.width*dpr; TR.ctx=cv.getContext("2d"); TR.ctx.setTransform(dpr,0,0,dpr,0,0); }

function draw(){

    });

function goNext(){ const T=cur.T; cur.recent.push(T.items[cur.idx]); cur.idx=(cur.idx+1)%T.items.length;
  if(cur.recent.length>=3){ const pool=cur.recent; cur.recent=[]; cur.inQuiz=true;
    const withSnd=pool.every(x=>x.snd&&hasSfx(x.snd)&&!pool.some(y=>y!==x&&y.snd===x.snd));
    if(withSnd&&R()<.5){ const ans=pool[rand(3)]; quiz(pool,teach,ans,{q:{q:S.whoSound[0],qh:S.whoSound[1]},pre:()=>sndThen(ans.snd),rightPre:()=>sndThen(ans.snd)}); }
    else quiz(pool,teach); }
  else teach(); }

/* one question, three big answers. Sound only when the answer is right. */
function quiz(pool,next,ans=pool[rand(pool.length)],o={}){
  stopAll(); cur.resume=()=>quiz(pool,next,ans,o);
  if((PROF().age||2)<=1&&pool.length>2&&!o.keep){ pool=[ans,pool.find(x=>x!==ans)]; o={...o,two:true}; }
  const opts=o.keep?pool:shuffle(pool), Q=o.q||ans; let asks=0, wt=null;
  const qseg=()=>o.en?{t:Q.q}:bi(Q.q,Q.qh), NS=x=>o.en?{t:x.en+"!"}:nameSeg(x), PR=()=>o.en?{t:PRAISE[rand(PRAISE.length)]}:praise();
  stage.innerHTML=`<div class="q">${o.en?Q.q:T_(Q.q,Q.qh)}</div>${o.head||""}<div class="choices${o.two?" two":""}">${opts.map((x,i)=>`<button data-i="${i}" aria-label="${x.en}">${x.choice}</button>`).join("")}</div>`;
  const btns=[...stage.querySelectorAll(".choices button")];
  const wait=()=>{ clearTimeout(wt); wt=later(()=>{ if(asks<3) ask(); else hint(); },9000); };
  const ask=()=>{ asks++; play([...(o.pre?o.pre():[]),qseg()],wait); };
  const hint=()=>{ btns[opts.indexOf(ans)].classList.add("bounce"); play([o.en?{t:S.hereItIs[0]}:sx("hereItIs"),NS(ans)],()=>later(next,1600)); };
  btns.forEach(b=>b.onclick=()=>{ const x=opts[+b.dataset.i];
    if(x===ans){ stopAll(); btns.forEach(y=>y.disabled=true); b.classList.remove("bounce"); b.classList.add("right"); anim(b,"pop"); cheer(); burstAt(b);
      o.right&&o.right();
      play([...(o.rightPre?o.rightPre():[]),...(o.rightSay?o.rightSay():[NS(ans),PR()])],()=>later(next,900)); }
    else { stopAll(); anim(b,"shake"); play([...(o.wrongSay?o.wrongSay(x):[NS(x),o.en?{t:S.tryAgain[0]}:sx("tryAgain")]),qseg()],wait); } });
  later(ask,300);
}

  const cv=$("paint"), r=cv.getBoundingClientRect(), S=Math.round(r.width), dpr=Math.min(2,devicePixelRatio||1);
  cv.width=S*dpr; cv.height=S*dpr; const c=cv.getContext("2d"); c.scale(dpr,dpr); c.lineCap="round"; c.lineJoin="round";
  let mode=0, hue=0, down=false, last=null, n=0;

  const at=e=>{ const b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; };

    c.beginPath(); c.moveTo(...(last||p)); c.lineTo(...p); c.stroke(); last=p; };
  cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); down=true; last=null; draw(e); });
  cv.addEventListener("pointermove",e=>{ if(down) (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(draw); });

  settings:["Settings","Parents: solve this to open settings","सेटिंग्स","माता-पिता: सेटिंग्स के लिए हल करें"],
  unlock:["Locked game","Parents: solve this to open it","बंद खेल","माता-पिता: खोलने के लिए हल करें"],
  rest:["More time?","Parents: solve this to keep playing","और समय?","माता-पिता: खेलना जारी रखने के लिए हल करें"]};
function showGate(mode,ok){
  gateMode=mode; gateOk=ok||null; const a=1+rand(5), b=1+rand(4); gateA=a+b; const tx=GATE_TXT[mode], hi=lang==="hi";
  $("geq").textContent=`${a} + ${b} =`; $("gans").textContent="";
  $("gtitle").textContent=hi?tx[2]:tx[0]; $("gsub").textContent=hi?tx[3]:tx[1];
  $("gcancel").textContent=hi?"रहने दो":"Not now"; $("gcancel").hidden=mode==="enter"||mode==="rest"; $("gate").hidden=false;
}
$("gkeys").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; const k=+b.dataset.k; $("gans").textContent=k;
  if(k===gateA){ setTimeout(()=>{ $("gate").hidden=true; if(gateMode==="enter") startApp(); else if(gateMode==="exit") byeBye(); else if(gateMode==="settings") openSettings(); else if(gateMode==="rest"){ playedMs=0; $("rest").hidden=true; if(!$("home").hidden) startTune(); } else gateOk&&gateOk(); },250); }
  else { anim($("gans"),"shake"); setTimeout(()=>showGate(gateMode,gateOk),600); } };
$("gcancel").onclick=()=>{ $("gate").hidden=true; };
$("exitBtn").onclick=()=>showGate("exit");
$("setBtn").onclick=()=>showGate("settings");
async function startApp(){
  unlock(); $("home").hidden=false; renderHome();
  await Promise.race([Promise.all([...VPACKS,"sfx"].map(loadPack)),new Promise(r=>setTimeout(r,5000))]);
  ["win","pop","ding","tap",(TUNES[ST.tune]||TUNES.sunny)[0]].forEach(k=>k&&decode("sfx",k));
  if(!$("home").hidden){ run++; play([sx("welcome")],()=>startTune()); }
}
function byeBye(){ stopAll(); stopTune(); $("home").hidden=true; $("play").hidden=true; $("bye").hidden=false; play([sx("bye")]); allowExit=true; try{ history.go(-(history.length-1)); }catch(e){} try{ window.close(); }catch(e){} }
$("byeback").onclick=()=>{ $("bye").hidden=true; allowExit=false; try{ history.pushState({p:"home"},""); }catch(e){} $("home").hidden=false; renderHome(); startTune(); };
try{ history.replaceState({p:"root"},""); history.pushState({p:"home"},""); }catch(e){}
window.addEventListener("popstate",e=>{
  const p=e.state?.p;
  if(!$("settings").hidden){ closeSettings(); try{ history.pushState({p:"home"},""); }catch(err){} return; }
  if(!$("play").hidden){ goHome(); if(p==="root"){ try{ history.pushState({p:"home"},""); }catch(err){} } return; }
  if(p==="root"&&!allowExit){ try{ history.pushState({p:"home"},""); }catch(err){} if($("gate").hidden&&$("bye").hidden) showGate("exit"); }
});
$("tuneBtn").onclick=()=>{ tuneOn=!tuneOn; $("tuneBtn").textContent=tuneOn?"🎵":"🔇"; tuneOn?startTune():stopTune(); };

/* screen-time limit */
let playedMs=0, lastTick=Date.now();
setInterval(()=>{ const now=Date.now(), dt=now-lastTick; lastTick=now; if(document.hidden||!$("gate").hidden||!$("rest").hidden||!$("bye").hidden||!$("settings").hidden) return;
  if($("home").hidden&&$("play").hidden) return; playedMs+=dt;
  if(ST.screen&&playedMs>=ST.screen*60000){ stopAll(); stopTune(); if(!$("play").hidden) goHome(); stopTune();
    $("restT").textContent=lang==="hi"?"आराम का समय!":"Time to rest!"; $("restP").textContent=lang==="hi"?"अभी खेलने का समय पूरा हुआ।":"Playtime is over for now. Parents can add more time.";
    $("restOk").textContent=lang==="hi"?"माता-पिता: और समय":"Parents: more time"; $("rest").hidden=false; run++; play([sx("rest")]); } },5000);
$("restOk").onclick=()=>showGate("rest");

/* =================================================================== settings (parents) */
const AVATARS=["🐰","🐱","🐶","🦁","🐼","🦄","🐥","🐻","🐸","🦋","⭐","🌸"];
const THEMES={auto:["Each world its own","हर दुनिया की अपनी","linear-gradient(90deg,#7CCBFF,#86CF6E,#2F8FD6,#2A2468,#FFD6EC)"],sky:["Sunny sky","नीला आसमान","#7CCBFF"],jungle:["Jungle","जंगल","#86CF6E"],ocean:["Under the sea","समुद्र के अंदर","#2F8FD6"],space:["Space","अंतरिक्ष","#2A2468"],fantasy:["Fairy land","परियों का देश","#FFD6EC"],art:["Art room","चित्रकला कक्ष","#FFE08A"]};
let editing=null;
function openSettings(){ stopAll(); $("settings").hidden=false; renderSettings(); try{ history.pushState({p:"set"},""); }catch(e){} }
function closeSettings(){ $("settings").hidden=true; stopTune(); renderHome(); if(!$("home").hidden) startTune(); }
const opt=(on,html,act)=>`<button class="opt" aria-pressed="${on}" data-act="${act}">${html}</button>`;
function renderSettings(){
  const hi=lang==="hi", L=(e,h)=>hi?h:e, P=PROF();
  const prof=ST.profiles.map((p,i)=>`<div class="prof"><span class="av">${p.av}</span><span class="pn">${p.name||L("No name yet","अभी नाम नहीं")}<br><small>${L("Age","उम्र")} ${p.age} · ⭐ ${p.stars||0}</small></span>${i===ST.active?`<b>✓ ${L("Playing","चालू")}</b>`:opt(false,L("Use","चुनो"),`use:${i}`)}${opt(false,"✏️",`edit:${i}`)}${ST.profiles.length>1?opt(false,"🗑️",`del:${i}`):""}</div>`).join("");
  const ed=editing!=null?ST.profiles[editing]:null;
  $("setCard").innerHTML=`<div class="sheethead"><h3>⚙️ ${L("Settings","सेटिंग्स")}</h3><button class="closebtn" data-act="close">${L("Done","हो गया")}</button></div>
  <div class="sec"><h4>👧 ${L("Child profile","बच्चे की प्रोफ़ाइल")}</h4>${prof}${opt(false,"➕ "+L("Add a child","बच्चा जोड़ें"),"add")}
   ${ed?`<div class="sec" style="background:#fff"><div class="rowlab"><span>${L("Name","नाम")}</span><input type="text" id="pname" maxlength="16" value="${(ed.name||"").replace(/"/g,"&quot;")}" placeholder="${L("Child's name","बच्चे का नाम")}"></div>
   <div class="rowlab"><span>${L("Picture","तस्वीर")}</span><div class="opts">${AVATARS.map(a=>opt(ed.av===a,a,`av:${a}`)).join("")}</div></div>
   <div class="rowlab"><span>${L("Age","उम्र")}</span><div class="opts">${[1,2,3,4].map(a=>opt(ed.age===a,a===4?"4+":a,`age:${a}`)).join("")}</div></div>
   <p>${L("Age 1 shows 2 choices in quizzes; older children get 3.","1 साल वालों को 2 विकल्प, बड़े बच्चों को 3।")}</p>${opt(false,"✓ "+L("Save","सहेजें"),"saveprof")}</div>`:""}</div>
  <div class="sec"><h4>🗣️ ${L("Language","भाषा")}</h4><div class="opts">${opt(lang==="en","English","lang:en")}${opt(lang==="both","English + हिंदी","lang:both")}${opt(lang==="hi","हिंदी","lang:hi")}</div><p>${L("English: only English. English + हिंदी: both on screen and in the voice. हिंदी: only Hindi.","English: सिर्फ़ अंग्रेज़ी। दोनों: अंग्रेज़ी और हिंदी। हिंदी: सिर्फ़ हिंदी।")}</p></div>
  <div class="sec"><h4>🎨 ${L("Theme","थीम")}</h4><div class="opts">${Object.entries(THEMES).map(([k,v])=>opt(ST.theme===k,`<span class="swatch" style="background:${v[2]}"></span>${L(v[0],v[1])}`,`theme:${k}`)).join("")}</div></div>
  <div class="sec"><h4>🔤 ${L("Font style","अक्षरों की शैली")}</h4><div class="opts">${Object.entries(FONTS).map(([k,v])=>opt(ST.font===k,`<span style="font-family:${v[0]}">Aa ${L(v[1],v[2])}</span>`,`font:${k}`)).join("")}</div></div>
  <div class="sec"><h4>🎵 ${L("Background music","पीछे की धुन")}</h4><div class="opts">${Object.entries(TUNES).map(([k,v])=>opt(ST.tune===k,L(v[1],v[2]),`tune:${k}`)).join("")}</div>
   <div class="rowlab"><span>${L("Music","धुन")}</span><input type="range" min="0" max="1" step=".05" value="${ST.music}" data-vol="music"></div>
   <div class="rowlab"><span>${L("Voice","आवाज़")}</span><input type="range" min="0" max="1" step=".05" value="${ST.voice}" data-vol="voice"></div>
   <div class="rowlab"><span>${L("Sounds","ध्वनियाँ")}</span><input type="range" min="0" max="1" step=".05" value="${ST.fx}" data-vol="fx"></div></div>
  <div class="sec"><h4>⏭️ ${L("Lesson pace","पाठ की रफ़्तार")}</h4><div class="opts">${opt(ST.autoNext,L("Moves on by itself","अपने आप आगे बढ़े"),"auto:1")}${opt(!ST.autoNext,L("Wait for ⏭ Next","⏭ दबाने पर आगे"),"auto:0")}</div></div>
  <div class="sec"><h4>⏰ ${L("Screen time","स्क्रीन टाइम")}</h4><div class="opts">${[0,10,15,20,30,45].map(m=>opt(ST.screen===m,m?`${m} min`:L("No limit","कोई सीमा नहीं"),`screen:${m}`)).join("")}</div><p>${L("When time is up, the app asks the child to rest. Only a parent can add more time.","समय पूरा होने पर ऐप आराम करने को कहेगा। सिर्फ़ माता-पिता और समय दे सकते हैं।")}</p></div>
  <div class="sec"><h4>🔒 ${L("Lock games","खेल बंद करें")}</h4><p>${L("Tap a game to lock or unlock it. A locked game needs the parent sum to open.","किसी खेल को बंद या चालू करने के लिए टैप करें।")}</p>
   ${SHELVES.map(s=>`<b>${s.i} ${L(s.t,s.th)}</b><div class="lockgrid">${s.cards.map(c=>`<button class="lockrow" aria-pressed="${!!ST.locks[c.id]}" data-act="lock:${c.id}">${ST.locks[c.id]?"🔒":"🔓"} ${c.i} ${L(c.t,c.th)}</button>`).join("")}</div>`).join("")}</div>
  <div class="sec"><h4>🚪 ${L("Parent lock when the app opens","ऐप खुलने पर पैरेंट लॉक")}</h4><div class="opts">${opt(ST.gateOpen,L("On","चालू"),"gate:1")}${opt(!ST.gateOpen,L("Off","बंद"),"gate:0")}</div></div>
  <div class="sec"><h4>ℹ️ ${L("About","जानकारी")}</h4><p>Baby Sparkle · ${L("Voice made with the Kokoro AI voice. Real animal and everyday sounds from the ESC-50 collection (CC BY-NC). Works offline after the first open.","आवाज़ Kokoro AI से बनी है। जानवरों की असली आवाज़ें ESC-50 संग्रह से। पहली बार खुलने के बाद बिना इंटरनेट चलता है।")}</p>${opt(false,"⭐ "+L("Reset stars","स्टार शून्य करें"),"resetstars")}</div>`;
}
$("setCard").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const [a,v]=b.dataset.act.split(/:(.*)/s);
  const P=ST.profiles;
  if(a==="close"){ if(history.state?.p==="set") history.back(); else closeSettings(); return; }
  if(a==="use"){ ST.active=+v; }
  else if(a==="edit"){ editing=+v; }
  else if(a==="add"){ P.push({name:"",av:AVATARS[P.length%AVATARS.length],age:2,stars:0}); editing=P.length-1; }
  else if(a==="del"){ P.splice(+v,1); ST.active=Math.min(ST.active,P.length-1); editing=null; }
  else if(a==="av"){ P[editing].av=v; }
  else if(a==="age"){ P[editing].age=+v; }
  else if(a==="saveprof"){ P[editing].name=($("pname").value||"").trim().slice(0,16); ST.active=editing; editing=null; }
  else if(a==="lang"){ lang=ST.lang=v; showNote(); }
  else if(a==="theme"){ ST.theme=v; setScene("sky"); }
  else if(a==="font"){ ST.font=v; applyFont(); }
  else if(a==="tune"){ ST.tune=v; stopTune(); startTune(true); }
  else if(a==="auto"){ ST.autoNext=v==="1"; }
  else if(a==="screen"){ ST.screen=+v; playedMs=0; }
  else if(a==="lock"){ if(ST.locks[v]) delete ST.locks[v]; else ST.locks[v]=1; }
  else if(a==="gate"){ ST.gateOpen=v==="1"; }
  else if(a==="resetstars"){ PROF().stars=0; }
  if(editing!=null&&a!=="saveprof"&&$("pname")) P[editing].name=($("pname").value||"").trim().slice(0,16);
  save(); renderSettings();
});
$("setCard").addEventListener("input",e=>{ const k=e.target.dataset.vol; if(!k) return; ST[k]=+e.target.value; applyVol(); save(); });

function showNote(){
  const n=$("note"); if(!n) return;
  if(!PACK["voice-en1"]&&!synth){ n.textContent=lang==="hi"?"आवाज़ की फ़ाइलें लोड नहीं हुईं। इंटरनेट चालू करके ऐप फिर खोलें।":"The voice files did not load. Turn on the internet and open the app again."; n.hidden=false; return; }
  n.hidden=true;
}
function setLang(l){ lang=ST.lang=l; save(); showNote(); renderHome(); }
$("langPill").onclick=e=>{ const b=e.target.closest("button"); if(b) setLang(b.dataset.l); };
["sfx",...VPACKS].forEach(loadPack);
if(ST.gateOpen) showGate("enter");
else { $("gate").hidden=false; document.querySelector(".eq").hidden=true; $("gkeys").hidden=true; $("gtitle").textContent="Baby Sparkle"; $("gsub").textContent=lang==="hi"?"शुरू करने के लिए टैप करें":"Tap to start"; $("gcancel").hidden=false; $("gcancel").textContent="▶ "+(lang==="hi"?"शुरू":"Start");
  $("gcancel").onclick=()=>{ $("gate").hidden=true; $("gkeys").hidden=false; document.querySelector(".eq").hidden=false; $("gcancel").onclick=()=>{ $("gate").hidden=true; }; startApp(); }; }

/* =================================================================== every sentence the app can say (used to record the voice packs) */
function allPhrases(){
  const out=new Map(); const A=(l,t)=>{ if(t) out.set(vkey(l,t),[l,norm(t)]); }; const B=(e,h)=>{ A("en",e); A("hi",h); };
  Object.values(S).forEach(([e,h])=>B(e,h)); Object.values(RVSAY).forEach(([e,h])=>B(e,h));
  PRAISE.forEach(t=>A("en",t)); PRAISE_HI.forEach(t=>A("hi",t));
  Object.values(LN).forEach(t=>A("en",t)); NUMW.forEach(w=>A("en",w+"!")); NUM_HI.forEach(t=>A("hi",t));
  Object.values(TOPICS).forEach(T=>T.items.forEach(it=>{ B(it.en+"!",it.hi+"!"); B(it.q,it.qh); A("en",it.sent); A("hi",it.sentHi); A("en",it.sayQ); A("en",it.word+"!");
    if(T.count) A("en",`${it.en} ${it.n===1?sing(it.th[1]):it.th[1]}!`); }));
  WORDS.forEach(w=>{ A("en",w[0]+"!"); A("en",`Where is the ${w[0].toLowerCase()}?`); });
  LINES.forEach(o=>{ B(o.say,o.sayHi); A("en",o.done); });
  ABC.forEach(([L,w,e,h])=>{ A("en",`Let's write ${LN[L]}.`); A("hi",`${LNH[L]} लिखो`); A("en",`Wow! ${LN[L]}!`); A("en",`${LN[L]}, for ${w}!`); A("hi",`${LNH[L]} से ${h}`);
    B(LN[L]+"!",LNH[L]+"!"); B(`Pop the letter ${LN[L]}!`,`${LNH[L]} फोड़ो!`); A("en",`Which one starts with ${LN[L]}?`); A("en",`Yes! ${LN[L]}, for ${w}!`); });
  NUM_EN.forEach((w,i)=>{ A("en",`Let's write ${w}.`); A("hi",`${NUM_HI[i]} लिखो`); const n=i+1, th=THINGS[i]; A("en",`${NUMW[i]} ${n===1?sing(th[1]):th[1]}!`); });
  DOTS.forEach(o=>B(...dotDone(o)));
  TAPPOOL.forEach(p=>B(p.en+"!",p.hi+"!"));
  FEED.forEach(a=>[feedAsk,feedHere,feedYum,feedNo].forEach(f=>B(...f(a))));
  THINGS.forEach(th=>{ B(...hmQ(th)); for(let n=1;n<=6;n++) B(...hmYes(n,th)); });
  COLS.forEach(c=>{ B(c[0]+"!",c[2]+"!"); B(`Pop the ${c[0].toLowerCase()} bubbles!`,`${c[2]} बुलबुला फोड़ो!`); });
  ANIMALS.forEach(a=>{ B(a[0]+"!",a[2]+"!"); B(`Pop the ${a[0].toLowerCase()}!`,`${a[2]} फोड़ो!`); B(`Who says ${a[3]}?`,`कौन बोले ${a[4]}?`); B(`The ${a[0].toLowerCase()} says, ${a[3]}!`,`${a[2]} बोले ${a[4]}`); });
  VEHICLES.forEach(v=>{ B(v[0]+"!",v[2]+"!"); B(v[3],v[4]); });
  HOMESOUNDS.forEach(h=>{ B(h[0]+"!",h[2]+"!"); B(cap1(h[4])+"!",h[5]+"!"); });
  FIRSTW.forEach(w=>{ A("en",w[0]+"!"); A("en",`${w[0]} starts with ${LN[w[0][0].toUpperCase()]}.`); });
  PATSETS.flat().forEach(x=>B(x.en+"!",x.hi+"!"));
  SIZEPICS.forEach(p=>{ B(...sizeQ(p,true)); B(...sizeQ(p,false)); B(`Big ${lc(p.en)}!`,`बड़ा ${p.hi}!`); B(`Small ${lc(p.en)}!`,`छोटा ${p.hi}!`); });
  CMPT.forEach(th=>{ B(...CMPQ.more(th)); B(...CMPQ.less(th)); for(let n=1;n<=6;n++){ const g=grpName(n,th); B(g.en+"!",g.hi+"!"); } });
  ["tall","short","long","shortc","heavy","light"].forEach(k=>B(...CMPQ[k]));
  B("The tall tower!","ऊँचा टावर!"); B("The short tower!","छोटा टावर!"); B("The long one!","लंबी इल्ली!"); B("The short one!","छोटी इल्ली!");
  HEAVY.flat().forEach(x=>B(x[1]+"!",x[2]+"!"));
  SORTS.forEach((S0,si)=>{ B(...sortOr(S0)); [S0.A,S0.B].forEach((L,side)=>L.forEach(it=>{ A("en",sortAsk(it)); A("en",`${it[0]} ${SORT_SAY[si][side]}!`); A("en",`${it[0]} ${SORT_SAY[si][side]}.`); })); });
  PICS.forEach(p=>{ B(p.en+"!",p.hi+"!"); B(...jigDone(p)); B(...shadowQ(p)); });
  PAGES.forEach(pg=>{ B(...colIntro(pg)); B(...colDone(pg)); });
  BODYP.forEach(b=>{ B(b.en+"!",b.hi+"!"); B(b.s,b.sh); B(b.q,b.qh); });
  ACTIONS.forEach(a=>B(a.say,a.sayHi));
  /* added in v3 */
  Object.values(TOPICS).forEach(T=>T.items.forEach(it=>A("hi",it.sayQh)));
  LINES.forEach(o=>A("hi",o.doneHi));
  SHAPES.forEach(([n,k,h])=>{ B(...shapeIntro(n,h)); B(...shapeDone(n,h)); });
  WASHV.forEach(v=>B(...washDone(v)));
  SORTS.forEach((S0,si)=>[S0.A,S0.B].forEach((L,side)=>L.forEach(it=>{ A("hi",sortAskHi(it)); A("hi",`${HN[it[0]]} ${SORT_SAY_HI[si][side]}!`); A("hi",`${HN[it[0]]} ${SORT_SAY_HI[si][side]}।`); })));
  PEEKERS().forEach(p=>B(p.en+"!",p.hi+"!"));
  return [...out.values()];
}
window.allPhrases=allPhrases; window.fnv=fnv;

</script>
